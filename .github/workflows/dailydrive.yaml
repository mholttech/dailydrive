
name: Daily Drive

on:
  # Manual trigger — inputs override repository variables for one-off runs.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - podcast-only
          - dry-run

  # Scheduled runs (Monday–Friday only). GitHub Actions cron runs in UTC.
  # These are set to EST (UTC-5). During EDT (UTC-4, roughly Mar–Nov),
  # runs will fire at 6:30 AM and 4:30 PM ET instead — still reasonable.
  schedule:
    - cron: '10 * * * 1-5'  # 10 minutes past every hour, Monday–Friday

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Prepare config.yaml with secrets
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          node -e '
            const fs = require("fs");
            const yaml = require("js-yaml");
            const config = yaml.load(fs.readFileSync("config.yaml", "utf8"));
            config.spotify.client_id = process.env.SPOTIFY_CLIENT_ID;
            config.spotify.client_secret = process.env.SPOTIFY_CLIENT_SECRET;
            fs.writeFileSync("config.yaml", yaml.dump(config));
            console.log("config.yaml prepared with injected secrets.");
          '
      - name: Write Spotify token
        env:
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          echo '{"access_token":"","refresh_token":"'"$SPOTIFY_REFRESH_TOKEN"'","expires_at":0}' > .spotify-token.json
      # Debug: Print DD_STATE_JSON before run
      - name: Debug - Print DD_STATE_JSON before run
        run: |
          echo "DD_STATE_JSON before run:"
          echo "${{ vars.DD_STATE_JSON }}"
      - name: Restore persistent state
        id: restore_state
        run: |
          echo "Restoring persistent state..."
          if [ -n "${{ vars.DD_STATE_JSON }}" ]; then
            echo "STATE_JSON=${{ vars.DD_STATE_JSON }}" >> $GITHUB_ENV
            echo "Loaded state from DD_STATE_JSON variable."
          else
            echo "No DD_STATE_JSON variable set; starting with empty state."
          fi
      - name: Run Daily Drive
        id: run_dd
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          case "$MODE" in
            podcast-only) node index.js --podcast-only > dd_output.txt 2>&1 ;;
            dry-run)      node index.js --dry-run > dd_output.txt 2>&1 ;;
            *)            npm start > dd_output.txt 2>&1 ;;
          esac
      # Debug: Print state-gh.json after run
      - name: Debug - Print state-gh.json after run
        if: always()
        run: |
          echo "state-gh.json after run:"
          if [ -f state-gh.json ]; then
            cat state-gh.json
          else
            echo "state-gh.json not found."
          fi
      - name: Persist state to GitHub variable
        if: success() && github.event.inputs.mode != 'dry-run'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f state-gh.json ]; then
            STATE=$(cat state-gh.json)
            if [ -n "$STATE" ]; then
              echo "Found new state in state-gh.json. Saving to repository variable DD_STATE_JSON."
              gh variable set DD_STATE_JSON --body "$STATE"
            else
              echo "state-gh.json is empty."
            fi
          else
            echo "state-gh.json not found."
          fi
      - name: Persist refresh token if rotated
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not configured — skipping refresh token update (token rotation will not be persisted)"
            exit 0
          fi
          NEW_TOKEN=$(node -p "require('./.spotify-token.json').refresh_token")
          gh secret set SPOTIFY_REFRESH_TOKEN --body "$NEW_TOKEN"
          echo "Refresh token updated."